; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	https://github.com/bolderflight/units.git
	https://github.com/bolderflight/wmm.git
	lovyan03/LovyanGFX@^1.2.25
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit LSM303 Accel@^1.1.9
	adafruit/Adafruit LIS2MDL@^2.1.8
	adafruit/RTClib@^2.1.4
	hideakitai/ArduinoEigen@^0.3.2
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-D IDF_CCACHE_ENABLE=1
board_build.cmake_extra_args = -DCCACHE_ENABLE=ON

[platformio]
description = LSM303 with CYD
build_cache_dir = .pio/cache
